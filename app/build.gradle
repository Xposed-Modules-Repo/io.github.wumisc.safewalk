plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.wumisc.safewalk'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.wumisc.safewalk"
        minSdk 30
        targetSdk 35
        versionCode 7
        versionName "1.7"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // LSPosed API，仅编译期
    compileOnly 'de.robv.android.xposed:api:82'
    // Material 组件
    implementation 'com.google.android.material:material:1.12.0'
}
